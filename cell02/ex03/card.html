<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <section class="card">
        <h2 class="header">User Profile Card</h2>

        <!-- Card container -->
            <table class="card_container">
                <tr class="picture">
                    <td>
                        <img class="profile" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSvltYngNj7VBJKgjnoxhkoNwAukAShDGqGc_By__mnlLi96hYPVXbog_mZ&s=10" alt="">
                    </td>
                </tr>

                <!-- login -->
                <tr>
                    <td class="login">
                        <h3>Wil 42</h3>
                    </td>
                </tr>
                
                <!-- description -->
                <tr>
                    <td class="desc">
                        <p>From dev to the moon</p>
                    </td>
                </tr>

                <!-- Social  -->
                <tr>
                    <td class="socials">
                        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/25/25231.png" alt="GitHub"></a>
                        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="LinkedIn"></a>
                        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/124/124021.png" alt="Twitter"></a>
                    </td>
                </tr>

                <!-- clickable button -->
                <tr>
                    <td class="contact">
                        <button>
                            Contact
                        </button>
                    </td>
                </tr>
            </table>
    </section>
</body>
</html>
